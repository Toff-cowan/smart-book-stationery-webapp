# Render Blueprint — Flask API
# https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Or create a Web Service manually with the same settings.

services:
  - type: web
    name: smart-book-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: FLASK_APP=app.app:app flask db upgrade
    startCommand: gunicorn "app.app:app" --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FLASK_APP
        value: app.app:app
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BOOKSTORE_NOTIFY_EMAIL
        sync: false
      - key: BOOKSTORE_PHONE
        sync: false
      - key: MAIL_LOGO_URL
        sync: false
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
